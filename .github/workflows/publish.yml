name: Publish images

on:
  push:
    branches: [main]
    paths:
      - dev/**
      - scripts/**
      - .github/workflows/publish.yml
  # Rebuild on a schedule so published images pick up operating-system and
  # upstream tool updates even when this repository has no source change.
  schedule:
    - cron: 40 3 * * 1
  workflow_dispatch:
    inputs:
      no-cache:
        description: Rebuild every layer instead of reusing the build cache.
        type: boolean
        default: false

# One publication at a time: overlapping runs would race for the shared
# tags and could replace a newer image with an older one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare publication
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      date: ${{ steps.tags.outputs.date }}
      started-at: ${{ steps.tags.outputs.started-at }}
      no-cache: ${{ steps.cache.outputs.no-cache }}
    steps:
      - name: Generate image tags
        id: tags
        run: |
          echo "date=$(date --utc +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "started-at=$(date --utc +%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve cache mode
        id: cache
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.no-cache }}
        run: |
          # A scheduled rebuild only refreshes the image when it re-runs every
          # layer instead of restoring the cache written by the last build.
          if [ "$EVENT_NAME" = schedule ] || [ "$REQUESTED" = true ]; then
            echo "no-cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-cache=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: publira-dev
            context: dev
            file: dev/Dockerfile
            platform: linux/amd64
            platform-id: amd64
            runner: ubuntu-24.04
          - image: publira-dev
            context: dev
            file: dev/Dockerfile
            platform: linux/arm64
            platform-id: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Publira development image
            org.opencontainers.image.description=Development base image for Publira Dev Containers.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          # The attestations travel with the per-platform image, so the merged
          # manifest describes how each platform was built and what it contains.
          provenance: mode=max
          sbom: true
          no-cache: ${{ needs.prepare.outputs.no-cache == 'true' }}
          # A platform-specific cache avoids concurrent writes to one GHA cache scope.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform-id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform-id }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          printf '%s\n' "$digest" > "${{ runner.temp }}/digests/${digest#*:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform-id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }} manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - image: publira-dev
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Create and push manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          image_refs=()
          for digest_file in *; do
            read -r digest < "$digest_file"
            image_refs+=("ghcr.io/${{ github.repository }}/${{ matrix.image }}@${digest}")
          done
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest" \
            --tag "ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare.outputs.date }}" \
            --tag "ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare.outputs.date }}-${{ github.run_number }}" \
            "${image_refs[@]}"
          digest="$(
            docker buildx imagetools inspect --format '{{json .Manifest}}' \
              "ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare.outputs.date }}-${{ github.run_number }}" \
              | jq --raw-output .digest
          )"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -o pipefail
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          jq --exit-status '
            [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
            | sort == ["amd64", "arm64"]
          ' <<<"$manifest"

          # Every platform keeps its own attestation manifest, and each of them
          # has to carry both the provenance and the SBOM predicate.
          attestations="$(
            jq --raw-output '
              .manifests[]
              | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              | .digest
            ' <<<"$manifest"
          )"
          if [ "$(printf '%s\n' "$attestations" | grep --count .)" -ne 2 ]; then
            echo "::error::the published manifest does not attest both platforms"
            exit 1
          fi
          for attestation in $attestations; do
            docker buildx imagetools inspect --raw "${IMAGE}@${attestation}" \
              | jq --exit-status '
                  [.layers[].annotations["in-toto.io/predicate-type"]] as $predicates
                  | ($predicates | any(test("slsa.dev/provenance")))
                    and ($predicates | any(test("spdx.dev")))
                '
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Record publication time
        run: |
          started_at="${{ needs.prepare.outputs.started-at }}"
          completed_at="$(date --utc +%s)"
          elapsed_seconds=$((completed_at - started_at))
          {
            echo '## Publication time'
            echo
            echo "- Started (UTC): $(date --utc --date="@${started_at}" --iso-8601=seconds)"
            echo "- Completed (UTC): $(date --utc --date="@${completed_at}" --iso-8601=seconds)"
            echo "- Elapsed: ${elapsed_seconds} seconds"
          } >> "$GITHUB_STEP_SUMMARY"

  corresponding-source:
    name: Publish ${{ matrix.image }} Corresponding Source
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: publira-dev
            context: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Collect the Corresponding Source
        run: |
          ./scripts/collect-corresponding-source.sh \
            --image-directory "${{ matrix.context }}" \
            --output "${{ runner.temp }}/corresponding-source" \
            --image-reference "ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare.outputs.date }}-${{ github.run_number }}"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf %s "$GITHUB_TOKEN" \
            | oras login ghcr.io \
                --username "${{ github.repository_owner }}" \
                --password-stdin

      # The source is published beside the image and shares its tags, so it
      # stays available for as long as the image version it belongs to.
      - name: Push the Corresponding Source
        working-directory: ${{ runner.temp }}/corresponding-source
        env:
          PACKAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}-corresponding-source
          TAGS: latest,${{ needs.prepare.outputs.date }},${{ needs.prepare.outputs.date }}-${{ github.run_number }}
        run: |
          files=("CORRESPONDING_SOURCE.md:text/markdown")
          for archive in *.tar.gz; do
            files+=("${archive}:application/gzip")
          done
          oras push \
            --artifact-type application/vnd.publira.corresponding-source \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=Corresponding Source of the copyleft components in ${{ matrix.image }}." \
            "${PACKAGE}:${TAGS}" \
            "${files[@]}"

  verify:
    name: Verify ${{ matrix.image }} pull (${{ matrix.platform }})
    needs: [prepare, merge]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: publira-dev
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: publira-dev
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf %s "$GITHUB_TOKEN" \
            | oras login ghcr.io \
                --username "${{ github.repository_owner }}" \
                --password-stdin

